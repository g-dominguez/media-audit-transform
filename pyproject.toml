[project]
name = "media-audit"
version = "0.1.0"
description = "Audit a folder of video and prepare selected clips for Runway Aleph"
requires-python = ">=3.12"
dependencies = ["runwayml>=5.29"]

[project.scripts]
media-audit = "media_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
